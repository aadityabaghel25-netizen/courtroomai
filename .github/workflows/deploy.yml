name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Unit tests only: no live API calls, no model downloads, no corpus data.
      - name: Run unit tests
        run: python -m pytest -m "not live and not models and not corpus" -q
      - name: No non-Nebius LLM provider in code
        run: |
          ! grep -rnE "groq|anthropic|google\.generativeai|mistralai|cohere|ollama" --include='*.py' core backend rag ingestion scripts eval

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
